name: Delta scanner checks
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run build