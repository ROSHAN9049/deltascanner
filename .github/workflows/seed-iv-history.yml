name: Seed Options IV History

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-options-iv-history
  cancel-in-progress: false

jobs:
  seed:
    name: Seed current BTC/ETH IV snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DELTA_ENVIRONMENT: SIGNAL_ONLY
      DELTA_EXECUTION_MODE: disabled
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Seed current IV snapshot
        shell: bash
        run: |
          set -o pipefail
          npm run options:iv:seed 2>&1 | tee iv-seed.log
      - name: Upload seed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: options-iv-seed-log
          path: iv-seed.log
          if-no-files-found: warn
          retention-days: 14
