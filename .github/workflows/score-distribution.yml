name: Score distribution analysis

on:
  workflow_dispatch:
  push:
    branches: ['feat/score-normalization-shadow']

permissions:
  contents: read

jobs:
  score-distribution:
    name: Read-only seven-day score distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check DATABASE_URL secret exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured."
            exit 1
          fi
          echo "DATABASE_URL secret is present (value hidden)."

      - name: Run read-only seven-day dd_signals distribution
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/score-distribution.mjs --database > score-distribution-report.json

      - name: Add summary to workflow run
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("score-distribution-report.json","utf8")); const p=r.byStrategyDistribution; const lines=["### Score Normalization · Last 7 Days","", "Source: "+r.source, "Rows scanned: "+r.count, "Observed data range: "+r.observedRange.earliest+" to "+r.observedRange.latest+" ("+r.observedRange.observedHours+" hours observed)", "", "| Strategy | Original ≥85% | Normalized ≥85% | Normalized >80% | Normalized sample |","|---|---:|---:|---:|---:|"]; for(const [s,v] of Object.entries(p)) lines.push("| "+s+" | "+v.originalAtLeast85PctSamePopulation+"% | "+v.normalizedAtLeast85PctSamePopulation+"% | "+v.normalizedGreaterThan80Pct+"% | "+v.normalizedCount+" |"); lines.push("", "Overall normalized ≥85%: "+r.normalized.atLeast85.actualPct+"% (target <2%).","Same-population normalized coverage: "+r.normalized.coveragePct+"%.","", "Caveat: "+r.note); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");'

      - name: Upload distribution report
        uses: actions/upload-artifact@v4
        with:
          name: score-normalization-distribution
          path: score-distribution-report.json
          if-no-files-found: error
          retention-days: 7
