name: Score distribution analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-distribution:
    name: Score distribution analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check DATABASE_URL secret exists
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not configured. Add it at https://github.com/ROSHAN9049/deltascanner/settings/secrets/actions"
            exit 1
          fi
          echo "DATABASE_URL secret is present (value hidden)."

      - name: Export signal cache (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/export-signal-cache.mjs > scores.json

      - name: Analyze score distribution
        run: |
          node scripts/score-distribution.mjs scores.json | tee /tmp/score-distribution.json

      - name: Add analysis result to workflow summary
        run: |
          {
            echo "### Score Distribution Analysis"
            echo ""
            echo "First 40 lines of the JSON report:"
            sed -n '1,40p' /tmp/score-distribution.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signal-cache export
        uses: actions/upload-artifact@v4
        with:
          name: signal-cache-scores
          path: scores.json
          if-no-files-found: error
          retention-days: 7
