name: Signal frequency report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    name: SQL-aggregated signal frequency analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Guard DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "DATABASE_URL secret is not configured; refusing database access." >&2
            exit 1
          fi
          echo "DATABASE_URL is configured (value hidden)."

      - name: Build aggregate report directly from PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/signal-frequency-report.mjs --output=signal-frequency-report.json 2>&1 | tee /tmp/signal-frequency-report.txt || report_status=$?
          head -n 60 /tmp/signal-frequency-report.txt >> "$GITHUB_STEP_SUMMARY"
          exit "${report_status:-0}"

      - name: Upload aggregate report (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: signal-frequency-report-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: signal-frequency-report.json
