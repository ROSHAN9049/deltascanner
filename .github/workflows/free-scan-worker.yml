name: DEALDOST free scanner worker

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Manual test/run duration (scheduled runs use 330 minutes)"
        required: true
        type: choice
        default: "30"
        options:
          - "30"
          - "60"
          - "180"
          - "330"
  schedule:
    # Four best-effort sessions a day; intentionally not on the hour.
    - cron: "17 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: dealdost-free-scan-worker
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are capped at six hours; leave time for setup and shutdown.
    timeout-minutes: 355
    steps:
      - name: Check required repository secrets
        id: secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENGINE_SECRET: ${{ secrets.ENGINE_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          missing=()
          [ -n "${SUPABASE_URL:-}" ] || missing+=(SUPABASE_URL)
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          [ -n "${ENGINE_SECRET:-}" ] || missing+=(ENGINE_SECRET)
          [ -n "${DATABASE_URL:-}" ] || missing+=(DATABASE_URL)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Worker was not started. Add these repository Actions secrets in Settings > Secrets and variables > Actions: ${missing[*]}."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Required secrets are present (values are not displayed)."

      - name: Check out repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --omit=dev

      - name: Verify worker syntax
        if: steps.secrets.outputs.ready == 'true'
        run: node --check worker/index.mjs

      - name: Run in locked public scan-only mode
        if: steps.secrets.outputs.ready == 'true'
        env:
          DELTA_ENVIRONMENT: SIGNAL_ONLY
          TRADETRON_BRIDGE_ENABLED: "false"
          ALLOW_SCAN_ONLY_NO_BRIDGE: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENGINE_SECRET: ${{ secrets.ENGINE_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RETENTION_DAYS: "7"
          SIGNAL_HISTORY_SAMPLE_MINUTES: "60"
          TRADETRON_DEVELOPER_API_KEY: ${{ secrets.TRADETRON_DEVELOPER_API_KEY }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            minutes=330
          else
            minutes="${{ inputs.session_minutes }}"
          fi
          case "$minutes" in
            30|60|180|330) ;;
            *) echo "Invalid run duration"; exit 2 ;;
          esac
          echo "Starting public-data scan-only worker for ${minutes} minutes."
          echo "Tradetron signal routing is disabled; direct Delta order execution remains locked."
          set +e
          timeout --signal=TERM --kill-after=30s "${minutes}m" node worker/index.mjs
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Session reached its planned time cap and was stopped with SIGTERM."
            exit 0
          fi
          exit "$status"
